<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portaria – Controle de Acesso</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#cbd5e1;--pr:#1d4ed8;--ok:#15803d;--er:#b91c1c;--in:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#162033;--tx:#f1f5f9;--mu:#94a3b8;--bd:#334155;--pr:#3b82f6;--ok:#4ade80;--er:#f87171;--in:#1e293b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:700;margin:12px 0 6px}
label:first-child{margin-top:0}
input,select{width:100%;font:inherit;font-size:19px;padding:14px;border-radius:12px;border:2px solid var(--bd);background:var(--in);color:var(--tx)}
input:focus,select:focus{outline:3px solid var(--pr);border-color:var(--pr)}
.ok{border-color:var(--ok)}.bad{border-color:var(--er)}
.hint{font-size:14px;min-height:18px;color:var(--mu);margin-top:4px}
.hint.e{color:var(--er)}
.row{display:flex;gap:10px}.row>*{flex:1}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;padding:14px 6px;font:inherit;font-weight:700;border-radius:12px;border:2px solid var(--bd);background:var(--in);color:var(--tx)}
.seg button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.plate{margin:6px auto;width:100%;max-width:340px;aspect-ratio:3.2/1;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px #0004}
.plate.m{background:#fff;border:4px solid #111;color:#111}
.plate.m::before{content:"BRASIL";position:absolute;top:0;left:0;right:0;height:24%;background:#003399;color:#fff;font:700 12px system-ui;letter-spacing:4px;display:flex;align-items:center;justify-content:center}
.plate.m input{margin-top:20%}
.plate.c{background:#c9ccd1;border:4px solid #333;color:#111}
.plate.bad{border-color:var(--er)}
.plate input{all:unset;width:92%;text-align:center;font:700 clamp(34px,13vw,58px)/1 "Arial Narrow",Impact,monospace;letter-spacing:4px;text-transform:uppercase;color:inherit}
.plate input::placeholder{color:#0003}
#mic{width:100%;margin-top:8px;padding:16px;font:700 18px system-ui;border-radius:12px;border:2px solid var(--pr);background:var(--in);color:var(--tx)}
#mic.on{background:var(--er);border-color:var(--er);color:#fff;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.7}}
button.main{width:100%;padding:18px;margin-top:16px;font:800 20px system-ui;border:0;border-radius:14px;background:var(--ok);color:#fff}
.item{border-top:1px solid var(--bd);padding:10px 0;font-size:16px}
.item b{font-size:18px}
.tag{display:inline-block;background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:1px 8px;font-weight:700;font-size:14px}
.toast{position:fixed;left:14px;right:14px;bottom:14px;background:var(--ok);color:#fff;padding:16px;border-radius:14px;font-weight:700;text-align:center;display:none;max-width:530px;margin:auto}
</style>
</head>
<body>
<main>
<h1>🚧 Portaria · Registro de entrada</h1>
<div class="card">
<label for="nome">Nome do visitante / motorista</label>
<input id="nome" autocomplete="off" autocapitalize="words" placeholder="Nome completo">
<label for="cpf">CPF</label>
<input id="cpf" inputmode="numeric" placeholder="000.000.000-00" maxlength="14">
<div class="hint" id="cpfh"></div>
<label for="mor">Morador visitado</label>
<input id="mor" autocomplete="off" autocapitalize="words" placeholder="Nome do morador">
<div class="row">
<div><label for="qd">Quadra (A–F)</label><select id="qd"></select></div>
<div><label for="lt">Lote (1–29)</label><select id="lt"></select></div>
</div>
<label>Veículo</label>
<div class="seg" id="vseg"><button data-v="1" class="on">🚗 Com veículo</button><button data-v="0">🚶 A pé</button></div>
<div id="vbox">
<div class="plate m" id="plate"><input id="placa" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="8" placeholder="ABC1D23" aria-label="Placa"></div>
<div class="hint" id="plh" style="text-align:center">O modelo da placa muda sozinho conforme você digita</div>
<button id="mic" type="button">🎤 Falar a placa</button>
<div class="hint" id="voh" style="text-align:center">Ex.: “A B C um D dois três” ou “alfa bravo charlie 1 delta 2 3”</div>
</div>
<label for="dt">Data e hora de entrada</label>
<input id="dt" type="datetime-local" readonly tabindex="-1" style="opacity:.85;pointer-events:none">
<div class="hint">🔒 Registrado automaticamente pelo sistema (não editável)</div>
<button class="main" id="reg">✔ Registrar entrada</button>
</div>
<div class="card">
<label for="busca" style="margin-top:0">Registros (<span id="cnt">0</span>)</label>
<input id="busca" placeholder="Buscar por nome, placa, quadra…">
<div id="lista"></div>
</div>
</main>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
let comVeiculo=true,tipo='m',regs=[];
try{regs=JSON.parse(localStorage.getItem('portaria_regs')||'[]')}catch(e){regs=[]}
function salvar(){try{localStorage.setItem('portaria_regs',JSON.stringify(regs))}catch(e){}}

// Quadra A–F e Lote 1–29
$('qd').innerHTML='<option value="">Quadra…</option>'+'ABCDEF'.split('').map(l=>`<option>${l}</option>`).join('');
let lotes='<option value="">Lote…</option>';for(let i=1;i<=29;i++)lotes+=`<option>${i}</option>`;
$('lt').innerHTML=lotes;

// Data/hora automática (não editável)
function agora(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function tick(){$('dt').value=agora()}
tick();setInterval(tick,15000);

// CPF
function cpfOk(c){c=c.replace(/\D/g,'');if(c.length!==11||/^(\d)\1+$/.test(c))return false;
for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=c[i]*(t+1-i);if((s*10%11)%10!=c[t])return false}return true}
$('cpf').oninput=e=>{let v=e.target.value.replace(/\D/g,'').slice(0,11);
v=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');e.target.value=v;
const h=$('cpfh');e.target.className='';h.className='hint';
if(v.length===14){if(cpfOk(v)){e.target.className='ok';h.textContent='✔ CPF válido'}else{e.target.className='bad';h.className='hint e';h.textContent='CPF inválido'}}else h.textContent=''};

// Placa: o modelo (Mercosul ou cinza) é detectado automaticamente
// 5º caractere LETRA → Mercosul (ABC1D23) | 5º caractere NÚMERO → cinza antiga (ABC-1234)
function placaOk(v){return /^[A-Z]{3}\d[A-Z]\d{2}$/.test(v)||/^[A-Z]{3}-\d{4}$/.test(v)}
function atualizaPlaca(){
const el=$('placa');
let v=el.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,7);
tipo=v.length>=5&&/\d/.test(v[4])?'c':'m';
el.value=tipo==='c'&&v.length>3?v.slice(0,3)+'-'+v.slice(3):v;
const p=$('plate'),h=$('plh');
p.className='plate '+tipo;h.className='hint';h.style.textAlign='center';
if(v.length<5){h.textContent='O modelo da placa muda sozinho conforme você digita'}
else{
const nome=tipo==='m'?'Mercosul':'Cinza (antiga)';
if(v.length===7){if(placaOk(el.value))h.textContent='✔ Placa '+nome+' válida';else{p.classList.add('bad');h.className='hint e';h.textContent='Formato inválido para placa '+nome}}
else h.textContent='Modelo detectado: '+nome}}
$('placa').oninput=atualizaPlaca;
$('vseg').onclick=e=>{const b=e.target.closest('button');if(!b)return;comVeiculo=b.dataset.v==='1';
[...$('vseg').children].forEach(x=>x.classList.toggle('on',x===b));$('vbox').style.display=comVeiculo?'block':'none'};

// Voz
const MAPA={};
'a:a,be:b,ce:c,se:c,de:d,e:e,efe:f,ge:g,je:g,aga:h,ha:h,i:i,jota:j,ji:j,ka:k,ca:k,ele:l,eme:m,ene:n,o:o,pe:p,que:q,ke:q,erre:r,ere:r,esse:s,te:t,u:u,ve:v,xis:x,ics:x,ipsilon:y,ze:z,alfa:a,alpha:a,bravo:b,charlie:c,delta:d,eco:e,echo:e,foxtrot:f,golf:g,hotel:h,india:i,juliet:j,juliett:j,kilo:k,lima:l,mike:m,november:n,oscar:o,papa:p,quebec:q,romeu:r,romeo:r,sierra:s,tango:t,uniforme:u,uniform:u,victor:v,whiskey:w,xray:x,yankee:y,zulu:z,zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,meia:6,sete:7,oito:8,nove:9'.split(',').forEach(p=>{const[k,v]=p.split(':');MAPA[k]=v.toUpperCase()});
function parsePlaca(t){let o='';t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/[\s,.\-]+/).forEach(w=>{if(!w)return;if(MAPA[w]!==undefined)o+=MAPA[w];else if(/^[a-z0-9]+$/.test(w))o+=w.toUpperCase()});return o.slice(0,7)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,ouvindo=false;
function resetMic(){ouvindo=false;$('mic').classList.remove('on');$('mic').textContent='🎤 Falar a placa'}
function toast(m,er){const t=$('toast');t.textContent=m;t.style.background=er?'#b91c1c':'';t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
$('mic').onclick=()=>{
if(!SR)return toast('Voz não suportada neste navegador. Use Chrome ou Safari.',1);
if(ouvindo&&rec){rec.stop();return}
try{rec=new SR();rec.lang='pt-BR';rec.maxAlternatives=5;rec.interimResults=false;
rec.onstart=()=>{ouvindo=true;$('mic').classList.add('on');$('mic').textContent='🎙️ Ouvindo… fale a placa'};
rec.onend=resetMic;
rec.onerror=e=>{resetMic();toast(e.error==='not-allowed'||e.error==='service-not-allowed'?'Permita o uso do microfone':e.error==='no-speech'?'Não ouvi nada, tente de novo':'Erro de voz: '+e.error,1)};
rec.onresult=e=>{const r=e.results[0];let best='',heard=r[0].transcript;
for(let i=0;i<r.length;i++){const p=parsePlaca(r[i].transcript);if(/^[A-Z]{3}\d[A-Z]\d{2}$/.test(p)||/^[A-Z]{3}\d{4}$/.test(p)){best=p;heard=r[i].transcript;break}}
if(!best)best=parsePlaca(r[0].transcript);
$('placa').value=best;atualizaPlaca();
$('voh').textContent='Ouvi: “'+heard+'” — confira a placa antes de registrar'};
rec.start()}catch(err){resetMic();toast('Não foi possível iniciar o microfone',1)}};

// Registrar
$('reg').onclick=()=>{
const nome=$('nome').value.trim(),cpf=$('cpf').value,mor=$('mor').value.trim(),qd=$('qd').value,lt=$('lt').value,placa=$('placa').value;
if(nome.split(/\s+/).length<2)return toast('Informe o nome completo',1);
if(!cpfOk(cpf))return toast('CPF inválido',1);
if(!mor)return toast('Informe o morador visitado',1);
if(!/^[A-F]$/.test(qd))return toast('Escolha a quadra (A a F)',1);
if(!(+lt>=1&&+lt<=29))return toast('Escolha o lote (1 a 29)',1);
if(comVeiculo&&!placaOk(placa))return toast('Placa inválida',1);
regs.unshift({id:Date.now(),nome,cpf,mor,qd,lt,placa:comVeiculo?placa:'',tipo:comVeiculo?tipo:'',dt:agora()});
salvar();['nome','cpf','mor','placa'].forEach(i=>$(i).value='');$('qd').value='';$('lt').value='';
$('cpf').className='';$('cpfh').textContent='';atualizaPlaca();$('voh').textContent='';tick();
toast('✔ Entrada registrada');render();window.scrollTo({top:0,behavior:'smooth'})};

// Lista
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){const q=$('busca').value.toLowerCase();
const l=regs.filter(r=>!q||(r.nome+r.mor+r.placa+r.cpf+r.qd+r.lt).toLowerCase().includes(q));
$('cnt').textContent=regs.length;
$('lista').innerHTML=l.slice(0,50).map(r=>{const d=new Date(r.dt);const ds=isNaN(d)?r.dt:d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
return `<div class="item"><b>${esc(r.nome)}</b> · ${esc(r.cpf)}<br>→ ${esc(r.mor)} <span class="tag">Q ${esc(r.qd)} · L ${esc(r.lt)}</span> ${r.placa?`<span class="tag">🚗 ${esc(r.placa)}</span>`:'<span class="tag">🚶 a pé</span>'}<br><small style="color:var(--mu)">${ds}</small></div>`}).join('')||'<div class="hint">Nenhum registro.</div>'}
$('busca').oninput=render;render();
</script>
</body>
</html>
